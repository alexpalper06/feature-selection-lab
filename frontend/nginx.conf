# https://vardhmanandroid2015.medium.com/beginners-guide-for-containerizing-application-deploying-a-full-stack-fastapi-and-react-app-001f2cac08a8
upstream backend {
    server backend:8000;  # FastAPI backend service in Docker
}

server {
    listen 80;  # Accept HTTP connections
    server_name _;

    root /usr/share/nginx/html;  # Serve React build files
    index index.html;  # Serve index.html for root requests

    # Proxy /api/* requests to FastAPI backend
    location /api/ {
        # These headers are important for passing client information to the backend
        proxy_pass http://backend;  # Forward to backend service
        proxy_set_header Host $host;  # Preserve original Host header for backend logging
        proxy_set_header X-Real-IP $remote_addr;  # Backend needs to know client's real IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Client IP chain for logging
        # proxy_set_header X-Forwarded-Proto $scheme;  # Preserve original protocol (http/https)
    }

    # React Router: serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;  # Fall back to index.html so React Router handles routing
    }

    # Docker container health check endpoint
    location /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
